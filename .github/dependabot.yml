# Dependabot: one grouped PR per ecosystem per week. Major bumps of the
# toolchain base images (golang, node) are deliberately excluded — the Go and
# Node versions are pinned to match go.mod / the frontend toolchain and are
# bumped by hand together with CI.
version: 2
updates:
  - package-ecosystem: gomod
    directory: /
    schedule: { interval: weekly }
    groups:
      go-deps: { patterns: ["*"] }
  - package-ecosystem: npm
    directory: /web
    schedule: { interval: weekly }
    groups:
      web-deps: { patterns: ["*"] }
  - package-ecosystem: npm
    directory: /docs
    schedule: { interval: weekly }
    groups:
      docs-deps: { patterns: ["*"] }
  - package-ecosystem: github-actions
    directory: /
    schedule: { interval: weekly }
    groups:
      actions: { patterns: ["*"] }
  - package-ecosystem: docker
    directory: /
    schedule: { interval: weekly }
    groups:
      docker-images: { patterns: ["*"] }
    ignore:
      - dependency-name: golang
        update-types: ["version-update:semver-major", "version-update:semver-minor"]
      - dependency-name: node
        update-types: ["version-update:semver-major"]
