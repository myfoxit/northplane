name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

permissions:
  contents: read

jobs:
  # Build the embedded UI once and share it so the Go build/embed works
  # on every matrix leg without each re-running npm.
  ui:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: cd web && npm ci
      - name: frontend lint
        run: cd web && npm run lint
      - name: frontend tests (vitest)
        run: cd web && npm test
      - name: frontend build
        run: cd web && npm run build
      - run: |
          rm -rf internal/web/dist
          cp -r web/dist internal/web/dist
      - uses: actions/upload-artifact@v4
        with:
          name: ui-dist
          path: internal/web/dist
          retention-days: 1

  # Typed-codegen drift gate (ADR-10): regenerate web/src/types.gen.ts from the
  # Go API's OpenAPI spec and fail if it differs from the committed file. A red
  # diff means the Go API changed but the generated TS types weren't refreshed
  # (run `make types` and commit). Needs both Go (to dump the spec offline via
  # `northplaned openapi`) and Node (for the openapi-typescript codegen).
  types:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.25"
          cache: true
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: cd web && npm ci
      - name: regenerate types and fail on drift
        run: make types-check

  # Static analysis gate: gofmt formatting + golangci-lint (errcheck, govet,
  # staticcheck, unused, ineffassign, misspell, unconvert, bodyclose — see
  # .golangci.yml). Compiles against the committed embedded UI.
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.25"
          cache: true
      - name: gofmt
        run: |
          unformatted=$(gofmt -l cmd internal)
          if [ -n "$unformatted" ]; then
            echo "These files need gofmt:"; echo "$unformatted"; exit 1
          fi
      # golangci-lint v2 (the committed .golangci.yml is v2 format). Install
      # via `go install` so it is built with this job's Go toolchain — the
      # prebuilt release binaries are compiled with an older Go and abort
      # against a go.mod that targets a newer Go ("the Go language version used
      # to build golangci-lint is lower than the targeted version").
      - name: golangci-lint
        run: |
          go install github.com/golangci/golangci-lint/v2/cmd/golangci-lint@v2.12.2
          golangci-lint run ./...

  test:
    needs: ui
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.25"
          cache: true
      - uses: actions/download-artifact@v4
        with:
          name: ui-dist
          path: internal/web/dist
      - name: go vet
        run: go vet ./...
      - name: go test -race
        run: go test -race ./...
      - name: build binaries
        run: |
          go build -o bin/northplaned ./cmd/northplaned
          go build -o bin/np ./cmd/np
          go build -o bin/np-agent ./cmd/np-agent

  # End-to-end: build northplaned with the embedded UI, then drive the real
  # --demo binary (Go backend + shadcn SPA) through Chromium with Playwright.
  # global-setup boots an isolated demo server per run; "green" here means the
  # whole product actually works through a browser, not just that it compiles.
  e2e:
    needs: ui
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.25"
          cache: true
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - uses: actions/download-artifact@v4
        with:
          name: ui-dist
          path: internal/web/dist
      - name: build northplaned (embeds the UI)
        run: go build -o bin/northplaned ./cmd/northplaned
      - name: install web deps
        run: cd web && npm ci
      - name: install Playwright Chromium
        run: cd web && npx playwright install --with-deps chromium
      - name: run E2E suite
        run: cd web && npm run test:e2e
      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: playwright-report
          path: web/playwright-report
          retention-days: 7

  # Run the storage suite against the real PostgreSQL backend too (the
  # store is dual-backend; SQLite is always exercised in `test`).
  #
  # Non-blocking: there is a KNOWN, pre-existing failure on PostgreSQL —
  # TestAuditChain cannot verify because before_json/after_json are stored as
  # jsonb (which normalizes the JSON text) while the tamper-evident row hash is
  # computed over the original text; the audit timestamp also round-trips at
  # microsecond precision on timestamptz. Fixing it needs a schema or hash-
  # canonicalization change with migration care, tracked separately. The
  # shipped product runs on SQLite (fully green in `test`); this job keeps the
  # PostgreSQL signal visible without blocking the pipeline or the CD gate.
  postgres:
    needs: ui
    continue-on-error: true
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: np
          POSTGRES_PASSWORD: np
          POSTGRES_DB: northplane
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U np"
          --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.25"
          cache: true
      - uses: actions/download-artifact@v4
        with:
          name: ui-dist
          path: internal/web/dist
      - name: storage tests (PostgreSQL matrix)
        env:
          NORTHPLANE_TEST_PG_DSN: postgres://np:np@localhost:5432/northplane?sslmode=disable
        run: go test ./internal/storage/...

  cross-build:
    needs: ui
    runs-on: ubuntu-latest
    strategy:
      matrix:
        target:
          - { goos: linux, goarch: amd64 }
          - { goos: linux, goarch: arm64 }
          - { goos: darwin, goarch: arm64 }
          - { goos: windows, goarch: amd64 }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.25"
          cache: true
      - uses: actions/download-artifact@v4
        with:
          name: ui-dist
          path: internal/web/dist
      - name: cross compile
        env:
          GOOS: ${{ matrix.target.goos }}
          GOARCH: ${{ matrix.target.goarch }}
          CGO_ENABLED: "0"
        run: |
          # northplaned needs unix process groups (plugin execution) and
          # is not shipped for windows; agent + CLI build everywhere.
          if [ "${GOOS}" != "windows" ]; then
            go build ./cmd/northplaned
          fi
          go build ./cmd/np
          go build ./cmd/np-agent
