name: Deploy

# Publish the app image to GHCR on every green build of main.
#
# The production host (np-01) PULLS this image itself (a short systemd timer
# runs `docker compose pull && up -d`), so nothing here ever SSHes into the
# infrastructure — CI never holds a key with root on a production host.
# "Deploy" = publish the artifact; the server rolls itself forward within a
# couple of minutes. See deploy/README.md.

on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]
    branches: [main]
  workflow_dispatch:

# One publish at a time; never cancel an in-flight build.
concurrency:
  group: deploy-production
  cancel-in-progress: false

permissions:
  contents: read
  packages: write # push the image to ghcr.io

jobs:
  publish:
    # Manual runs always proceed; automatic runs only on a GREEN CI run.
    if: >-
      github.event_name == 'workflow_dispatch' ||
      github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Resolve image ref
        id: img
        run: |
          SHA="${{ github.event.workflow_run.head_sha || github.sha }}"
          echo "ver=main-${SHA::12}" >> "$GITHUB_OUTPUT"

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          build-args: VERSION=${{ steps.img.outputs.ver }}
          tags: |
            ghcr.io/${{ github.repository }}:${{ steps.img.outputs.ver }}
            ghcr.io/${{ github.repository }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Summary
        run: |
          echo "Published ghcr.io/${{ github.repository }}:${{ steps.img.outputs.ver }} (and :latest)." >> "$GITHUB_STEP_SUMMARY"
          echo "np-01 auto-pulls :latest within ~2 min (northplane-pull.timer)." >> "$GITHUB_STEP_SUMMARY"
