# Northplane — one-command trial or small production install:
#
#   git clone https://github.com/myfoxit/northplane && cd northplane
#   docker compose up -d                                     → https://localhost
#   DOMAIN=monitoring.example.net docker compose up -d      → Let's Encrypt cert
#
# Caddy terminates TLS (internal self-signed cert for localhost, automatic
# Let's Encrypt once DOMAIN has a public DNS record pointing here) and proxies
# to northplaned inside the compose network. First run: open the URL and create
# your admin account on /setup. Data (SQLite, metrics, secret key) lives in the
# northplane-data volume — back it up.

services:
  northplane:
    image: ghcr.io/myfoxit/northplane:latest
    # build: .          # uncomment to build from source instead of the published image
    restart: unless-stopped
    environment:
      NORTHPLANE_LISTEN: ":8443"
      NORTHPLANE_TRUST_PROXY: "true" # Caddy terminates TLS and sets X-Forwarded-*
      NORTHPLANE_BASE_URL: "https://${DOMAIN:-localhost}"
      # Keep the interactive /setup page open on first start instead of seeding
      # a break-glass admin with a generated password (set NP_DEFAULT_ADMIN_EMAIL
      # + NP_DEFAULT_ADMIN_PASSWORD instead for unattended installs).
      NP_DEFAULT_ADMIN_DISABLED: "1"
      # NORTHPLANE_STORAGE_DSN: "postgres://np:np@db:5432/northplane?sslmode=disable"
    volumes:
      - northplane-data:/var/lib/northplane
    expose:
      - "8443" # compose-network only; Caddy publishes 80/443
    # no healthcheck here: the distroless image has no shell — Caddy probes it below

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    depends_on:
      - northplane
    ports:
      - "80:80"
      - "443:443"
    environment:
      DOMAIN: "${DOMAIN:-localhost}"
    volumes:
      - ./caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://northplane:8443/healthz"]
      interval: 30s
      timeout: 5s
      retries: 3

  # --- Optional: PostgreSQL instead of the embedded SQLite ------------------
  # (set NORTHPLANE_STORAGE_DSN above and add `db` to northplane.depends_on)
  # db:
  #   image: postgres:16
  #   restart: unless-stopped
  #   environment:
  #     POSTGRES_USER: np
  #     POSTGRES_PASSWORD: np
  #     POSTGRES_DB: northplane
  #   volumes:
  #     - pg-data:/var/lib/postgresql/data

volumes:
  northplane-data:
  caddy-data:
  caddy-config:
  # pg-data:
